name: JavaScript syntax checks

on:
  push:
    branches: ["main"]
    paths:
      - "*.js"
      - ".github/workflows/javascript-checks.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "*.js"
      - ".github/workflows/javascript-checks.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check
